<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clever Accounts</title>
    <style>
      html,body{height:100%;margin:0;background:#1A7A9B;color:#fff;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
      .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:14px;text-align:center;padding:24px}
      .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);
        border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
      @keyframes s{to{transform:rotate(360deg)}}
      p{opacity:.85;font-size:14px;max-width:22ch}
    </style>
  </head>
  <body>
    <!-- Shown only as an offline/loading fallback. In normal use the shell loads
         the live portal (server.url) and this page is never seen. -->
    <div class="wrap">
      <div class="spin"></div>
      <p>Connecting to your Clever Accounts portal…</p>
    </div>
  </body>
</html>
